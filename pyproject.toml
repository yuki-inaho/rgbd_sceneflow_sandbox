[project]
name = "rgbd-sceneflow"
version = "0.1.0"
description = "境界を保つ RGB-D シーンフロー補正（第0.3版）アーカイブの環境再構築と結果再現・検証ラボ"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3.5",
    "scipy>=1.17.0",
    "matplotlib>=3.10.8",
    "pillow>=12.3.0",
    "opencv-python-headless>=4.13.0.92",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "jupyter>=1.1.1",
    "ipykernel>=7.0.0",
    "nbformat>=5.10.4",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rgbd_sceneflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
# 配布実装はそのままの形で保持する（整形しない）。Notebook は実行結果と
# ソースの対応を崩さないため、lint と format の対象から外す。
extend-exclude = ["scene_flow_primitives", "notebooks"]
